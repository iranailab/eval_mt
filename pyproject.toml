[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluation-machine-translation"
dynamic = ["version"]
description = "Machine translation evaluation metrics (BLEU, NIST, GLEU, METEOR, WER, chrF) with a CLI and a FastAPI server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alireza Parvaresh", email = "parvvaresh@gmail.com" }]
keywords = ["nlp", "machine-translation", "evaluation", "bleu", "meteor", "wer", "chrf", "nist", "gleu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["nltk>=3.8.1", "numpy>=1.21"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "build>=1.2", "twine>=5"]

[project.scripts]
eval-mt = "eval_mt.cli:main"

[project.urls]
Homepage = "https://github.com/iranailab/eval_mt"
Repository = "https://github.com/iranailab/eval_mt"
Issues = "https://github.com/iranailab/eval_mt/issues"

[tool.setuptools.dynamic]
version = { attr = "eval_mt.__version__" }

[tool.setuptools.packages.find]
include = ["eval_mt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
# original metric implementations keep their tab-indented, upstream style
exclude = ["eval_mt/metrics/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
# original metric implementations keep their tab-indented, upstream style
"eval_mt/metrics/*" = ["E", "W", "B", "UP"]
"eval_mt/api.py" = ["B008"]
